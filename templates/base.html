<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Creator Studio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="orb orb-one"></div><div class="orb orb-two"></div>
  <header class="nav wrap"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">▶</span> CREATOR STUDIO</a><nav><a href="{{ url_for('index') }}">Create</a><a href="{{ url_for('index') }}#dictionary">Dictionary</a></nav></header>
  <main class="wrap">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}" role="alert">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
  <footer class="wrap">Built for focused creators · Local-first processing</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
